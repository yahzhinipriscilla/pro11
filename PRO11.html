<div class="ef-box">
  <h2>Register a Vehicle</h2>
  <label for="vname">Vehicle name</label>
  <input type="text" id="vname"><div class="ef-err" id="e1"></div>
  <label for="battery">Battery capacity (kWh)</label>
  <input type="text" id="battery"><div class="ef-err" id="e2"></div>
  <button class="ef-btn" onclick="validateForm()">Submit</button>
  <p id="ef-result" style="font-weight:bold"></p>
</div>

<footer>
  <p>Copyright 2026 by ecofleet Data. All Rights Reserved.</p>
</footer>

<script>
function validateForm() {
  var name = document.getElementById("vname").value.trim();
  var battery = document.getElementById("battery").value.trim();
  var ok = true;
  document.getElementById("e1").textContent = "";
  document.getElementById("e2").textContent = "";
  document.getElementById("ef-result").textContent = "";
  if (name == "") {                       // check if the box is empty
    document.getElementById("e1").textContent = "Vehicle name cannot be empty.";
    ok = false;
  }
  if (battery == "") {                    // check if the box is empty
    document.getElementById("e2").textContent = "Battery capacity cannot be empty.";
    ok = false;
  } else if (!/^[0-9]+$/.test(battery)) { // only numbers
    document.getElementById("e2").textContent = "Enter numbers only.";
    ok = false;
  }
  if (ok) { showResult(name, battery); }
}
function showResult(name, battery) {
  var range = Number(battery) * 6;        // about 6 km per kWh
  document.getElementById("ef-result").textContent =
    name + " registered: " + battery + " kWh battery, estimated range " + range + " km.";
}
</script>
